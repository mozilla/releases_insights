name: Firefox iOS open PR Slack announcement

on:
  schedule:
    # Thursdays at 16:00 UTC — the day before we branch for release,
    # this gives time for folks to review and merge.
    - cron: '0 16 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the message instead of posting to Slack'
        required: false
        type: boolean
        default: true
      test_date:
        description: 'Pretend today is this date (YYYY-MM-DD), e.g. 2026-08-27'
        required: false
        type: string

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remind if there are any open automated PRs pending before we branch
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.IOS_DEV_SLACK_WEBHOOK }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_DATE: ${{ inputs.test_date }}
        run: python3 app/scripts/ios_open_pr_slack_notifier.py
